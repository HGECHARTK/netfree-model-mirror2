name: mirror-gemma-e2b
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Install 7-Zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

      - name: Resolve GGUF repo and file on HuggingFace
        id: discover
        run: |
          echo "--- search 1 ---"
          curl -s -w "HTTP:%{http_code}\n" -o /tmp/s1.json "https://huggingface.co/api/models?search=gemma-4-E2B-it-GGUF&limit=100"
          echo "--- search 2 ---"
          curl -s -w "HTTP:%{http_code}\n" -o /tmp/s2.json "https://huggingface.co/api/models?search=gemma%204%20e2b&limit=100"
          echo "--- candidate repos (by downloads) ---"
          jq -s '[ .[0], .[1] ] | map(if type=="array" then . else [] end) | add | map(select(((.id|ascii_downcase)|contains("e2b")) and ((.id|ascii_downcase)|contains("gguf")))) | sort_by(.downloads) | reverse | .[0:20][] | "\(.downloads) \(.id)"' /tmp/s1.json /tmp/s2.json
          jq -s '[ .[0], .[1] ] | map(if type=="array" then . else [] end) | add | map(select(((.id|ascii_downcase)|contains("e2b")) and ((.id|ascii_downcase)|contains("gguf")))) | sort_by(.downloads) | reverse' /tmp/s1.json /tmp/s2.json > /tmp/cands.json
          REPO=$(jq -r 'map({id:.id,d:(if(.downloads==null) then 0 else .downloads end),s:((if(.id|ascii_downcase|contains("gemma-4-e2b")) then 0 else 1 end)+(if(.id|ascii_downcase|contains("q4")) then 0 else 1 end))}) | sort_by([.s,(-.d)]) | .[0].id' /tmp/cands.json)
          echo "using repo: $REPO"
          if [ -z "$REPO" ] || [ "$REPO" = "null" ]; then
            echo "NO_REPO_FOUND"
            exit 1
          fi
          curl -s -w "HTTP:%{http_code}\n" -o /tmp/tree.json "https://huggingface.co/api/models/$REPO/tree/main?recursive=true&expand=true"
          echo "--- files by size (top 15) ---"
          jq -r '[ .[] | select(.type=="file") | {path:.path,size:(.size//0)} ] | sort_by(.size) | reverse | .[0:15][] | "\(.size) \(.path)"' /tmp/tree.json
          TARGET=$(jq -r '[ .[] | select(.type=="file") | select((.path|test("(?i)\\.gguf$"))) | select((.path|test("(?i)mmproj|mtp|vision|encoder|projector|tokenizer|imatrix|audio|aux"))|not) | {path:.path,size:(.size//0)} ] | sort_by(.size) | reverse | .[0].path' /tmp/tree.json)
          if [ -z "$TARGET" ] || [ "$TARGET" = "null" ]; then
            echo "NO_TARGET_FOUND"
            exit 1
          fi
          echo "target: $TARGET"
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "archive=$TARGET" >> $GITHUB_OUTPUT

      - name: Download GGUF
        env:
          REPO: ${{ steps.discover.outputs.repo }}
          TARGET: ${{ steps.discover.outputs.archive }}
        run: |
          echo "Downloading $TARGET from $REPO ..."
          curl -sL --retry 8 --retry-all-errors -o model.gguf "https://huggingface.co/$REPO/resolve/main/$TARGET?download=true"
          ls -la model.gguf

      - name: Split into 7z parts (24MB)
        run: |
          mkdir -p parts
          7z a -bso0 -bsp0 -v24m -mx=1 "parts/gemma-e2b.7z" model.gguf
          echo "PARTS:"
          ls -la parts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(ls parts | wc -l)
          gh release create gemma-4-e2b --repo HGECHARTK/netfree-model-mirror2 --title "Gemma 4 E2B GGUF ($N parts)" --notes "Auto-mirror from HuggingFace (Netfree bypass)" || true
          gh release upload gemma-4-e2b --repo HGECHARTK/netfree-model-mirror2 parts/* --clobber
          echo "DONE: https://github.com/HGECHARTK/netfree-model-mirror2/releases/tag/gemma-4-e2b"