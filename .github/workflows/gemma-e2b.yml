name: mirror-gemma-e2b
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Install 7-Zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

      - name: Resolve GGUF repo and file on HuggingFace
        id: discover
        run: |
          echo "--- search 1 ---"
          curl -s -w "HTTP:%{http_code}\n" -o /tmp/s1.json "https://huggingface.co/api/models?search=gemma-4-E2B-it-GGUF&limit=100"
          echo "--- search 2 ---"
          curl -s -w "HTTP:%{http_code}\n" -o /tmp/s2.json "https://huggingface.co/api/models?search=gemma%204%20e2b&limit=100"
          echo "--- s1 (first 300 chars) ---"
          head -c 300 /tmp/s1.json
          echo ""
          echo "--- s2 (first 300 chars) ---"
          head -c 300 /tmp/s2.json
          echo ""
          echo "--- all gguf-ish hits, sorted by downloads ---"
          jq -s '[ .[0], .[1] ] | map(if type=="array" then . else [] end) | add | map(select(.id|ascii_downcase|endswith("gguf"))) | sort_by(.downloads) | reverse | .[0:15][] | "\(.downloads) \(.id)"' /tmp/s1.json /tmp/s2.json
          jq -s '[ .[0], .[1] ] | map(if type=="array" then . else [] end) | add | map(select(((.id|ascii_downcase)|contains("e2b")) and ((.id|ascii_downcase)|contains("gguf")))) | sort_by(.downloads) | reverse' /tmp/s1.json /tmp/s2.json > /tmp/cands.json
          if [ "$(jq -r 'length' /tmp/cands.json)" = "0" ]; then
            echo '{"ggml-org/gemma-4-E2B-it-GGUF":0,"unsloth/gemma-4-E2B0-it-GGUF":0,"unsloth/gemma-4-E2B-it-GGUF":0,"google/gemma-4-E2B1-IT-GGUF":0}' | jq 'to_entries | map({id:.key,downloads:.value})' > /tmp/cands.json
          fi
          echo "--- selected candidates ---"
          jq -r '.[].id' /tmp/cands.json
          REPO=$(jq -r '.[0].id' /tmp/cands.json)
          echo "using repo: $REPO"
          curl -s -w "HTTP:%{http_code}\n" -o /tmp/model.json "https://huggingface.co/api/models/$REPO"
          if ! grep -q '"siblings"' /tmp/model.json; then
            echo "REPO_NOT_FOUND: $REPO"
            head -c 300 /tmp/model.json
            echo ""
            exit 1
          fi
          TARGET=$(jq -r '.siblings[].rfilename' /tmp/model.json | grep -Ei '\.gguf$' | grep -Ei 'e2b' | grep -Ei 'q4_k_m' | head -1)
          if [ -z "$TARGET" ]; then
            TARGET=$(jq -r '.siblings[].rfilename' /tmp/model.json | grep -Ei '\.gguf$' | grep -Ei 'q4_k_m' | grep -Ev 'e4b|27b|35b|72b' | head -1)
          fi
          if [ -z "$TARGET" ]; then
            TARGET=$(jq -r '.siblings[].rfilename' /tmp/model.json | grep -Ei '\.gguf$' | grep -Ei 'e2b' | head -1)
          fi
          if [ -z "$TARGET" ]; then
            echo "NO_TARGET_FOUND"
            jq -r '.siblings[].rfilename' /tmp/model.json | head -40
            exit 1
          fi
          echo "target: $TARGET"
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "archive=$TARGET" >> $GITHUB_OUTPUT

      - name: Download GGUF
        env:
          REPO: ${{ steps.discover.outputs.repo }}
          TARGET: ${{ steps.discover.outputs.archive }}
        run: |
          echo "Downloading $TARGET from $REPO ..."
          curl -sL --retry 8 --retry-all-errors -o model.gguf "https://huggingface.co/$REPO/resolve/main/$TARGET?download=true"
          ls -la model.gguf

      - name: Split into 7z parts (24MB)
        run: |
          mkdir -p parts
          7z a -bso0 -bsp0 -v24m -mx=1 "parts/gemma-e2b.7z" model.gguf
          echo "PARTS:"
          ls -la parts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(ls parts | wc -l)
          gh release create gemma-4-e2b --repo HGECHARTK/netfree-model-mirror2 --title "Gemma 4 E2B GGUF ($N parts)" --notes "Auto-mirror from HuggingFace (Netfree bypass)" || true
          gh release upload gemma-4-e2b --repo HGECHARTK/netfree-model-mirror2 parts/* --clobber
          echo "DONE: https://github.com/HGECHARTK/netfree-model-mirror2/releases/tag/gemma-4-e2b"